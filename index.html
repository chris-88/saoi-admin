<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Full bleed: iOS rounds the corners itself and fills transparency with black. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#002F32" />
    <!-- Installed from Safari's share sheet: its own window, under its own name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Saoi admin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The operator's console: nothing here is for search engines. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta
      name="description"
      content="The presenter console for Saoi, an unaffiliated conversational banking prototype. Sign-in required."
    />
    <title>Saoi console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
